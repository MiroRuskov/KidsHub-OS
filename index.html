<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MakKuin — Меню и поръчки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F2EEE5; --card:#FFFFFF; --ink:#2B241C; --muted:#8C8172;
    --teal:#2E5C57; --teal-deep:#254A46; --mint:#3C8177; --mint-soft:#E3EFEC;
    --gold:#E8AE3D; --coral:#E2543C; --line:#EAE3D4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:'Nunito',sans-serif;min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;position:relative;}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(ellipse 500px 380px at 90% 8%, rgba(60,129,119,.10), transparent 60%),
      radial-gradient(ellipse 460px 420px at -10% 30%, rgba(226,84,60,.07), transparent 55%),
      radial-gradient(ellipse 520px 460px at 100% 78%, rgba(232,174,61,.10), transparent 55%);}
  .app{max-width:480px;margin:0 auto;position:relative;z-index:1;padding-bottom:100px;}
  nav{background:var(--teal);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;border-radius:0 0 20px 20px;}
  .logo{display:flex;align-items:center;gap:8px;color:#fff;font-family:'Fredoka',sans-serif;font-weight:600;font-size:17px;}
  .logo-dot{width:26px;height:26px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:13px;}
  .nav-cart{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;position:relative;cursor:pointer;}
  .nav-cart .badge{position:absolute;top:-3px;right:-3px;background:var(--coral);color:#fff;font-size:9px;font-weight:800;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
  header{padding:24px 20px 4px;}
  h1{font-family:'Fredoka',sans-serif;font-weight:600;font-size:32px;line-height:1.08;margin:0 0 4px;color:var(--ink);}
  .sub{color:var(--muted);font-size:14px;margin:0;font-weight:600;}
  .tabs{display:flex;gap:8px;padding:18px 20px 4px;overflow-x:auto;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{flex:0 0 auto;padding:9px 16px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--muted);font-size:13.5px;font-weight:700;cursor:pointer;white-space:nowrap;transition:background .2s ease,color .2s ease;font-family:'Nunito',sans-serif;}
  .tab.active{background:var(--teal);border-color:var(--teal);color:#fff;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:18px 20px 6px;transition:opacity .18s ease, transform .18s ease;}
  .card{background:var(--card);border-radius:20px;padding:44px 12px 14px;position:relative;box-shadow:0 6px 18px rgba(43,36,28,.06);opacity:0;transform:translateY(10px);animation:riseIn .45s ease forwards;cursor:pointer;}
  @keyframes riseIn{to{opacity:1;transform:translateY(0);}}
  .card-photo{width:88px;height:88px;border-radius:50%;position:absolute;top:-30px;left:50%;transform:translateX(-50%);overflow:hidden;box-shadow:0 6px 14px rgba(43,36,28,.18);border:4px solid #fff;background:#171310;}
  .card-photo svg,.card-photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .card-heart{position:absolute;top:-24px;left:8px;width:26px;height:26px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--coral);box-shadow:0 3px 8px rgba(0,0,0,.12);}
  .card-rating{position:absolute;top:-24px;right:8px;background:#fff;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:3px;box-shadow:0 3px 8px rgba(0,0,0,.12);}
  .card-name{font-family:'Fredoka',sans-serif;font-size:14.5px;font-weight:600;text-align:center;margin:2px 0 2px;line-height:1.2;}
  .card-desc{font-size:11px;color:var(--muted);text-align:center;line-height:1.35;margin:0 0 10px;min-height:28px;}
  .card-foot{display:flex;align-items:center;justify-content:space-between;padding:0 2px;}
  .card-price{font-family:'Fredoka',sans-serif;font-size:14px;font-weight:600;color:var(--teal-deep);}
  .add-circle{width:28px;height:28px;border-radius:50%;background:var(--mint);color:#fff;border:none;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .section-title{font-family:'Fredoka',sans-serif;font-weight:600;font-size:21px;padding:22px 20px 10px;margin:0;color:var(--ink);}
  .picks{display:flex;gap:12px;padding:0 20px 6px;overflow-x:auto;scrollbar-width:none;}
  .picks::-webkit-scrollbar{display:none;}
  .pick{flex:0 0 auto;width:190px;background:#fff;border-radius:16px;padding:10px;box-shadow:0 6px 16px rgba(43,36,28,.06);position:relative;}
  .pick-photo{width:100%;height:100px;border-radius:12px;overflow:hidden;position:relative;background:#171310;}
  .pick-photo svg,.pick-photo img{width:100%;height:100%;object-fit:cover;}
  .pick-badge{position:absolute;top:6px;left:6px;background:var(--coral);color:#fff;font-size:10px;font-weight:800;padding:3px 7px;border-radius:8px;}
  .pick-name{font-family:'Fredoka',sans-serif;font-size:13.5px;font-weight:600;margin:8px 0 6px;line-height:1.25;}
  .pick-btn{background:var(--mint-soft);color:var(--teal-deep);border:none;font-size:11.5px;font-weight:800;padding:6px 12px;border-radius:999px;font-family:'Nunito',sans-serif;cursor:pointer;}
  .overlay{position:fixed;inset:0;background:rgba(30,25,18,.5);opacity:0;pointer-events:none;transition:opacity .3s ease;z-index:20;}
  .overlay.open{opacity:1;pointer-events:auto;}
  .sheet{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:#fff;border-radius:26px 26px 0 0;transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.8,.25,1);z-index:21;max-height:88vh;overflow-y:auto;}
  .sheet.open{transform:translateY(0);}
  .sheet-hero{width:100%;aspect-ratio:4/3;position:relative;background:#171310;border-radius:26px 26px 0 0;overflow:hidden;}
  .sheet-hero svg,.sheet-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .close-btn{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.4);color:#fff;border:none;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2;}
  .sheet-body{padding:22px 22px 28px;}
  .sheet-name{font-family:'Fredoka',sans-serif;font-size:26px;font-weight:600;margin:0 0 8px;}
  .sheet-desc{color:var(--muted);font-size:14.5px;line-height:1.55;margin:0 0 14px;font-weight:600;}
  .allergens{color:var(--muted);font-size:12px;margin:0 0 20px;font-weight:600;}
  .allergens b{color:var(--ink);}
  .sheet-footer{display:flex;align-items:center;justify-content:space-between;gap:14px;}
  .price{font-family:'Fredoka',sans-serif;font-size:22px;color:var(--teal-deep);}
  .add-btn{background:var(--mint);color:#fff;border:none;padding:13px 22px;border-radius:999px;font-size:14.5px;font-weight:700;font-family:'Nunito',sans-serif;cursor:pointer;transition:transform .15s ease;}
  .add-btn:active{transform:scale(.96);}
  .add-btn.added{background:var(--gold);}

  /* Floating checkout bar */
  .checkout-bar{
    position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;
    background:var(--teal-deep);color:#fff;padding:14px 20px;
    display:flex;align-items:center;justify-content:space-between;
    border-radius:20px 20px 0 0;box-shadow:0 -6px 20px rgba(0,0,0,.15);
    transform:translateY(100%);transition:transform .3s ease;z-index:15;
    font-family:'Nunito',sans-serif;font-weight:700;
  }
  .checkout-bar.show{transform:translateY(0);}
  .checkout-bar button{background:var(--gold);color:var(--ink);border:none;padding:10px 18px;border-radius:999px;font-weight:800;font-family:'Nunito',sans-serif;cursor:pointer;}

  /* Cart sheet rows */
  .cart-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);}
  .cart-row-name{font-family:'Fredoka',sans-serif;font-size:14.5px;font-weight:600;}
  .cart-row-sub{color:var(--muted);font-size:12px;font-weight:600;}
  .qty-ctrl{display:flex;align-items:center;gap:8px;}
  .qty-ctrl button{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:#fff;font-weight:800;cursor:pointer;}
  .table-input{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--line);font-family:'Nunito',sans-serif;font-size:14px;margin:6px 0 16px;}
  .toast{
    position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-20px);
    background:var(--teal-deep);color:#fff;padding:12px 20px;border-radius:999px;
    font-weight:700;opacity:0;transition:all .3s ease;z-index:30;font-size:13.5px;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ---------- Staff / bar panel ---------- */
  .staff-app{max-width:520px;margin:0 auto;padding:20px;}
  .staff-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .staff-title{font-family:'Fredoka',sans-serif;font-size:24px;font-weight:600;}
  .sound-btn{background:var(--mint-soft);color:var(--teal-deep);border:none;padding:9px 14px;border-radius:999px;font-weight:800;font-size:13px;cursor:pointer;font-family:'Nunito',sans-serif;}
  .sound-btn.on{background:var(--mint);color:#fff;}
  .banner{
    position:fixed;top:0;left:0;right:0;background:var(--coral);color:#fff;
    text-align:center;padding:14px;font-weight:800;font-family:'Fredoka',sans-serif;
    transform:translateY(-100%);transition:transform .3s ease;z-index:40;font-size:15px;
  }
  .banner.show{transform:translateY(0);animation:pulseBanner 1s ease-in-out 2;}
  @keyframes pulseBanner{0%,100%{background:var(--coral);}50%{background:#B03826;}}
  .order-card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 4px 14px rgba(43,36,28,.07);border:2px solid transparent;}
  .order-card.fresh{border-color:var(--coral);animation:cardPulse 1.6s ease-in-out 3;}
  @keyframes cardPulse{0%,100%{box-shadow:0 4px 14px rgba(43,36,28,.07);}50%{box-shadow:0 0 0 6px rgba(226,84,60,.18);}}
  .order-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .order-table{font-family:'Fredoka',sans-serif;font-weight:600;font-size:16px;}
  .order-time{color:var(--muted);font-size:12px;font-weight:700;}
  .order-item{display:flex;justify-content:space-between;font-size:13.5px;padding:3px 0;font-weight:600;}
  .order-total{display:flex;justify-content:space-between;font-family:'Fredoka',sans-serif;font-weight:600;padding-top:8px;margin-top:6px;border-top:1px solid var(--line);}
  .order-status-btn{width:100%;margin-top:12px;padding:10px;border-radius:999px;border:none;font-weight:800;font-family:'Nunito',sans-serif;cursor:pointer;background:var(--mint);color:#fff;}
  .order-card.done{opacity:.5;}
  .order-card.done .order-status-btn{background:var(--line);color:var(--muted);}
  .empty-state{text-align:center;color:var(--muted);padding:60px 20px;font-weight:700;}
  .staff-link{display:block;text-align:center;color:var(--muted);font-size:11px;padding:10px;text-decoration:none;}
</style>
</head>
<body>

<div id="customerApp" class="app">
  <nav>
    <div class="logo"><span class="logo-dot">🎈</span> MakKuin</div>
    <div class="nav-cart" id="navCart">🧺<span class="badge" id="cartCount">0</span></div>
  </nav>
  <header>
    <h1>Нашето меню</h1>
    <p class="sub">Докосни ястие, за да го разгледаш по-отблизо</p>
  </header>
  <div class="tabs" id="tabs"></div>
  <div class="grid" id="grid"></div>
  <h2 class="section-title">Топ Избори</h2>
  <div class="picks" id="picks"></div>
  <a class="staff-link" href="#bar">Персонал</a>
</div>

<div id="staffApp" class="staff-app" style="display:none;">
  <div class="banner" id="banner">🔔 Нова поръчка!</div>
  <div class="staff-header">
    <span class="staff-title">Поръчки на бара</span>
    <button class="sound-btn" id="soundBtn">🔔 Включи звука</button>
  </div>
  <div id="ordersList"></div>
  <a class="staff-link" href="#">← Изглед за клиенти</a>
</div>

<!-- Item detail sheet -->
<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet">
  <div class="sheet-hero" id="sheetHero"><button class="close-btn" id="closeBtn">✕</button></div>
  <div class="sheet-body">
    <h2 class="sheet-name" id="sheetName"></h2>
    <p class="sheet-desc" id="sheetDesc"></p>
    <p class="allergens" id="sheetAllergens"></p>
    <div class="sheet-footer">
      <span class="price" id="sheetPrice"></span>
      <button class="add-btn" id="addBtn">Добави към поръчката</button>
    </div>
  </div>
</div>

<!-- Cart sheet -->
<div class="overlay" id="cartOverlay"></div>
<div class="sheet" id="cartSheet">
  <div class="sheet-body" style="padding-top:24px;">
    <h2 class="sheet-name" style="margin-bottom:14px;">Твоята поръчка</h2>
    <div id="cartRows"></div>
    <p style="font-family:'Fredoka',sans-serif;font-weight:600;font-size:13px;margin:14px 0 4px;">Номер на маса</p>
    <input class="table-input" id="tableInput" placeholder="напр. 5" inputmode="numeric">
    <div class="sheet-footer">
      <span class="price" id="cartTotal">0.00 €</span>
      <button class="add-btn" id="confirmOrderBtn">Поръчай</button>
    </div>
  </div>
</div>

<div class="checkout-bar" id="checkoutBar">
  <span id="checkoutSummary">🧺 0 артикула</span>
  <button id="checkoutBtn">Поръчай →</button>
</div>

<div class="toast" id="toast"></div>

function chickenBurgerSVG(){return `<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="bgGlow2" cx="50%" cy="35%" r="70%"><stop offset="0%" stop-color="#332920"/><stop offset="100%" stop-color="#1E1812"/></radialGradient></defs><rect width="300" height="300" fill="url(#bgGlow2)"/><ellipse cx="150" cy="220" rx="98" ry="15" fill="#000" opacity=".3"/><path d="M55 217 Q150 248 245 217 L242 233 Q150 260 58 233 Z" fill="#E8B15C"/><rect x="70" y="205" width="160" height="10" rx="4" fill="#D9BE93"/><rect x="62" y="178" width="176" height="30" rx="14" fill="#E3A73A"/><rect x="62" y="182" width="176" height="8" fill="#F0C169" opacity=".7"/><rect x="65" y="165" width="170" height="15" rx="6" fill="#B5372A" opacity=".85"/><path d="M58 150 Q150 88 242 150 L242 166 Q150 145 58 166 Z" fill="#E7AE64"/><circle cx="100" cy="118" r="3" fill="#FBE7BE"/><circle cx="130" cy="104" r="3" fill="#FBE7BE"/><circle cx="160" cy="100" r="3" fill="#FBE7BE"/><circle cx="190" cy="112" r="3" fill="#FBE7BE"/><g class="crumb"><circle cx="215" cy="182" r="2" fill="#8A5A2E"/></g><g class="crumb2"><circle cx="90" cy="188" r="2.3" fill="#8A5A2E"/></g><g class="steam" style="transform-origin:150px 128px;"><path d="M150 128 C140 108 158 98 150 78 C144 64 156 54 150 38" stroke="#F2E9DA" stroke-width="6" fill="none" stroke-linecap="round" opacity=".5"/></g><style>.steam{animation:riseA 3.6s ease-in-out infinite;}.crumb{animation:fall 2.8s ease-in infinite;}.crumb2{animation:fall 3.3s ease-in infinite .8s;}@keyframes riseA{0%{opacity:0;transform:translateY(14px);}30%{opacity:.55;}100%{opacity:0;transform:translateY(-18px);}}@keyframes fall{0%{opacity:0;transform:translateY(-6px);}40%{opacity:1;}100%{opacity:0;transform:translateY(8px);}}</style></svg>`;}

/* ================= Cart state ================= */
let cart = []; // {name, price, qty}

function addToCart(item){
  const existing = cart.find(c => c.name === item.name);
  if(existing) existing.qty++;
  else cart.push({name:item.name, price:item.price, qty:1});
  renderCheckoutBar();
  showToast(`${item.name} добавен`);
}
function cartCountTotal(){ return cart.reduce((s,c)=>s+c.qty,0); }
function cartPriceTotal(){ return cart.reduce((s,c)=>s+c.qty*c.price,0); }

function renderCheckoutBar(){
  const bar = document.getElementById('checkoutBar');
  const n = cartCountTotal();
  document.getElementById('cartCount').textContent = n;
  if(n > 0){
    bar.classList.add('show');
    document.getElementById('checkoutSummary').textContent = `🧺 ${n} артикула · ${cartPriceTotal().toFixed(2)} €`;
  } else {
    bar.classList.remove('show');
  }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ================= Menu render ================= */
const tabsEl = document.getElementById('tabs');
const gridEl = document.getElementById('grid');
const picksEl = document.getElementById('picks');
const categories = Object.keys(menu);
let activeCat = categories[0];

function renderTabs(){
  tabsEl.innerHTML = categories.map(c => `<div class="tab ${c===activeCat?'active':''}" data-cat="${c}">${c}</div>`).join('');
  tabsEl.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click', ()=>{
      if(t.dataset.cat === activeCat) return;
      activeCat = t.dataset.cat;
      renderTabs();
      gridEl.style.opacity='0'; gridEl.style.transform='translateY(6px)';
      setTimeout(()=>{ renderGrid(); gridEl.style.opacity='1'; gridEl.style.transform='translateY(0)'; }, 150);
    });
  });
}
function renderGrid(){
  const items = menu[activeCat];
  gridEl.innerHTML = items.map((it,i)=>`
    <div class="card" style="animation-delay:${i*70}ms" data-idx="${i}">
      <div class="card-photo">${it.photo ? `<img src="${it.photo}" alt="${it.name}" onerror="this.parentElement.innerHTML=menu['${activeCat}'][${i}].svg()">` : it.svg()}</div>
      <div class="card-heart">♡</div>
      <div class="card-rating">★ 5.0</div>
      <p class="card-name">${it.name}</p>
      <p class="card-desc">${it.desc}</p>
      <div class="card-foot">
        <span class="card-price">${it.price.toFixed(2)} €</span>
        <button class="add-circle" data-add="${i}">+</button>
      </div>
    </div>
  `).join('');
  gridEl.querySelectorAll('.card').forEach(el=>{
    el.addEventListener('click', (e)=>{
      if(e.target.closest('.add-circle')){ addToCart(items[+el.dataset.idx]); return; }
      openSheet(items[+el.dataset.idx]);
    });
  });
}
function renderPicks(){
  picksEl.innerHTML = picks.map((p,i)=>`
    <div class="pick" data-idx="${i}">
      <div class="pick-photo">${p.svg()}<span class="pick-badge">${p.badge}</span></div>
      <p class="pick-name">${p.name}</p>
      <button class="pick-btn" data-pick="${i}">добави</button>
    </div>
  `).join('');
  picksEl.querySelectorAll('.pick-btn').forEach((btn,i)=>{
    btn.addEventListener('click', ()=>{
      const p = picks[i];
      const priceGuess = Object.values(menu).flat().find(m=>m.name===p.name)?.price || 5;
      addToCart({name:p.name, price:priceGuess});
    });
  });
}

function renderCartRows(){
  const rowsEl = document.getElementById('cartRows');
  if(cart.length === 0){
    rowsEl.innerHTML = `<p style="color:var(--muted);font-weight:600;">Количката е празна.</p>`;
  } else {
    rowsEl.innerHTML = cart.map((c,i)=>`
      <div class="cart-row">
        <div>
          <div class="cart-row-name">${c.name}</div>
          <div class="cart-row-sub">${c.price.toFixed(2)} € × ${c.qty}</div>
        </div>
        <div class="qty-ctrl">
          <button data-dec="${i}">−</button>
          <span>${c.qty}</span>
          <button data-inc="${i}">+</button>
        </div>
      </div>
    `).join('');
    rowsEl.querySelectorAll('[data-inc]').forEach(b=>b.addEventListener('click', ()=>{ cart[+b.dataset.inc].qty++; renderCartRows(); renderCheckoutBar(); }));
    rowsEl.querySelectorAll('[data-dec]').forEach(b=>b.addEventListener('click', ()=>{

      cart[idx].qty--; if(cart[idx].qty<=0) cart.splice(idx,1);
      renderCartRows(); renderCheckoutBar();
    }));
  }
  document.getElementById('cartTotal').textContent = cartPriceTotal().toFixed(2) + ' €';
}

});

/* ================= Shared order storage ================= */
async function pushOrder(order){
  try{
    let list = [];
    try{
      const res = await window.storage.get('makkuin-orders', true);
      if(res && res.value) list = JSON.parse(res.value);
    }catch(e){ list = []; }
    list.unshift(order);
    if(list.length > 50) list = list.slice(0,50);
    await window.storage.set('makkuin-orders', JSON.stringify(list), true);
  }catch(e){ console.error('Order storage failed', e); }
}
async function fetchOrders(){
  try{
    const res = await window.storage.get('makkuin-orders', true);
    if(res && res.value) return JSON.parse(res.value);
  }catch(e){}
  return [];
}
async function saveOrders(list){
  try{ await window.storage.set('makkuin-orders', JSON.stringify(list), true); }catch(e){}
}

/* ================= Staff / bar panel ================= */
let seenIds = new Set();
let audioCtx = null;
let staffPollTimer = null;

function beep(freq, duration, delay){
  setTimeout(()=>{
    if(!audioCtx) return;
    try{
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.value = freq;
      osc.connect(gain); gain.connect(audioCtx.destination);
      gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration/1000);
      osc.start(); osc.stop(audioCtx.currentTime + duration/1000 + 0.02);
    }catch(e){}
  }, delay);
}
function playNotifySound(){ beep(880,180,0); beep(660,220,190); }

document.getElementById('soundBtn').addEventListener('click', function(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    this.textContent = '🔊 Звукът е активен';
    this.classList.add('on');
    beep(880,150,0);
  }
});

function renderStaffOrders(list, freshIds){
  const el = document.getElementById('ordersList');
  if(list.length === 0){
    el.innerHTML = `<div class="empty-state">Все още няма поръчки.<br>Ще се появят тук веднага щом клиент поръча.</div>`;
    return;
  }
  el.innerHTML = list.map(o=>`
    <div class="order-card ${o.status==='изпълнена' ? 'done' : ''} ${freshIds.has(o.id) ? 'fresh' : ''}" data-id="${o.id}">
      <div class="order-top">
        <span class="order-table">Маса ${o.table}</span>
        <span class="order-time">${o.time}</span>
      </div>
      ${o.items.map(it=>`<div class="order-item"><span>${it.qty}× ${it.name}</span><span>${(it.qty*it.price).toFixed(2)} €</span></div>`).join('')}
      <div class="order-total"><span>Общо</span><span>${o.total.toFixed(2)} €</span></div>
      <button class="order-status-btn" data-toggle="${o.id}">${o.status==='изпълнена' ? '✓ Изпълнена' : 'Маркирай като изпълнена'}</button>
    </div>
  `).join('');
  el.querySelectorAll('[data-toggle]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const list = await fetchOrders();
      const o = list.find(x=>x.id===btn.dataset.toggle);
      if(o){ o.status = o.status==='изпълнена' ? 'нова' : 'изпълнена'; await saveOrders(list); renderStaffOrders(list, new Set()); }
    });
  });
}

async function pollOrders(initial){
  const list = await fetchOrders();
  const freshIds = new Set();
  if(!initial){
    list.forEach(o=>{ if(!seenIds.has(o.id)) freshIds.add(o.id); });
    if(freshIds.size > 0){
      const first = list.find(o=>freshIds.has(o.id));
      showBanner(`🔔 Нова поръчка от Маса ${first.table}!`);
      playNotifySound();
    }
  }
  list.forEach(o=>seenIds.add(o.id));
  renderStaffOrders(list, freshIds);
}

function startStaffMode(){
  document.getElementById('customerApp').style.display = 'none';
  document.getElementById('staffApp').style.display = 'block';
  pollOrders(true);
  if(staffPollTimer) clearInterval(staffPollTimer);
  staffPollTimer = setInterval(()=>pollOrders(false), 4000);
}
function startCustomerMode(){
  document.getElementById('staffApp').style.display = 'none';
  document.getElementById('customerApp').style.display = 'block';
  if(staffPollTimer){ clearInterval(staffPollTimer); staffPollTimer = null; }
}

window.addEventListener('hashchange', ()=>{
  if(location.hash === '#bar') startStaffMode(); else startCustomerMode();
});

/* ================= Init ================= */
renderTabs();
renderGrid();
renderPicks();
renderCheckoutBar();
if(location.hash === '#bar') startStaffMode();
</script>
</body>
</html>
